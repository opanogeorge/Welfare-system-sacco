# docker compose -f deploy/docker-compose.yml up -d --build
# then: docker compose -f deploy/docker-compose.yml exec app php artisan migrate --force --seed
services:
  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: ../.env
    environment: { DB_HOST: db }
    volumes: [ storage:/var/www/html/storage/app ]
    depends_on: [ db ]
    restart: unless-stopped

  scheduler:                      # penalties, interest, reminders, fraud scan, backups, webhooks
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: ../.env
    environment: { DB_HOST: db }
    command: php artisan schedule:work
    volumes: [ storage:/var/www/html/storage/app ]
    depends_on: [ db ]
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports: [ "80:80" ]
    volumes:
      - ../public:/var/www/html/public:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [ app ]
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sacco}
      MYSQL_USER: ${DB_USERNAME:-sacco}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes: [ dbdata:/var/lib/mysql ]
    restart: unless-stopped

volumes:
  dbdata:
  storage:
